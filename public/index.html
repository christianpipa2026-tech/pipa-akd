<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Aprenda Pipa Akd com IA — de A1 a Master, grátis" />
    <title>Pipa Akd — Aprenda Español</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #FBFAF7; color: #1A1A18; -webkit-font-smoothing: antialiased; }
      :root {
        /* Paleta premium — verde Brasil + terracota + papel cálido */
        --color-accent: #0EA5E9;
        --color-accent-dark: #0369A1;
        --color-accent-warm: #C77B3D;
        --color-background-primary: #ffffff;
        --color-background-secondary: #F4F2EB;
        --color-text-primary: #1A1A18;
        --color-text-secondary: #5F5E56;
        --color-text-tertiary: #8C8A7E;
        --color-border-tertiary: rgba(26,26,24,0.10);
        --color-border-secondary: rgba(26,26,24,0.22);
        --border-radius-sm: 6px;
        --border-radius-md: 10px;
        --border-radius-lg: 16px;
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --shadow-card: 0 1px 2px rgba(26,26,24,0.04), 0 1px 1px rgba(26,26,24,0.03);
        --bg-accent: #E6F1FB; --text-accent: #0C447C;
        --bg-pro: #EEEDFE; --text-pro: #3C3489;
        --bg-warning: #FAEEDA; --text-warning: #854F0B;
        --bg-success: #EAF3DE; --text-success: #27500A;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-accent: #38BDF8;
          --color-accent-dark: #0EA5E9;
          --color-accent-warm: #D98F50;
          --color-background-primary: #1C1C1A;
          --color-background-secondary: #28281F;
          --color-text-primary: #F2EFE6;
          --color-text-secondary: #B6B3A6;
          --color-text-tertiary: #84826F;
          --color-border-tertiary: rgba(255,255,255,0.10);
          --color-border-secondary: rgba(255,255,255,0.22);
          --shadow-card: 0 1px 2px rgba(0,0,0,0.3);
        }
        body { background: #141412; }
      }
      h1, h2, h3 { letter-spacing: -0.02em; }
      ::selection { background: var(--color-accent); color: #fff; }
      :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").then((reg) => {
        console.log("SW registrado:", reg.scope);
      }).catch((err) => {
        console.log("SW error:", err);
      });
    }
  </script>
</body>
</html>
